[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-factory"
version = "0.1.0"
description = "Prompt document factory for external image generation workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=2.0.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]
